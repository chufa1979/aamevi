version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aamevi-postgres
    environment:
      POSTGRES_DB: aamevi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aamevi-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/aamevi_db"
      JWT_SECRET: "your-secret-key-change-in-prod"
      JWT_EXPIRATION: "7d"
      GOOGLE_CLIENT_ID: "xxx.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "xxx"
      SENDGRID_API_KEY: "SG.xxx"
      GCS_BUCKET_NAME: "aamevi-files"
      GCS_PROJECT_ID: "your-gcp-project"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aamevi-frontend
    ports:
      - "3001:3000"
    environment:
      REACT_APP_API_URL: "http://localhost:3000"
      REACT_APP_GOOGLE_CLIENT_ID: "xxx.apps.googleusercontent.com"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start

volumes:
  postgres_data:

networks:
  default:
    name: aamevi-network
