version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aamevi_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aamevi_db}
      MYSQL_USER: ${DB_USERNAME:-aamevi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aamevi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aamevi
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aamevi_app
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-aamevi_db}
      DB_USERNAME: ${DB_USERNAME:-aamevi}
      DB_PASSWORD: ${DB_PASSWORD:-aamevi}
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    networks:
      - aamevi
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  nginx:
    image: nginx:alpine
    container_name: aamevi_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aamevi
    depends_on:
      - app

volumes:
  mysql_data:
    driver: local

networks:
  aamevi:
    driver: bridge
